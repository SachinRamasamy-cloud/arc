[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "arc-platform"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.128.2,<0.140", "uvicorn>=0.40,<0.50", "sqlalchemy>=2.0.46,<2.1", "alembic>=1.18,<2", "pydantic-settings>=2.12,<3", "argon2-cffi>=25.1,<26", "cryptography>=46,<49", "httpx>=0.28,<0.29", "boto3>=1.42,<2", "python-multipart>=0.0.22,<0.1", "email-validator>=2.2,<3", "psycopg[binary]>=3.2,<4", "redis>=6,<8", "prometheus-client>=0.24,<1"]
[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-cov>=6,<8"]
[project.scripts]
arc = "entrypoints.foundation_cli:platform_main"
arc-foundation = "entrypoints.foundation_cli:main"
arc-identity = "entrypoints.identity_cli:main"
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["arc*", "modules*", "foundation*", "entrypoints*", "database*"]
[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["foundation_tests", "identity_tests"]
addopts = "-ra"
