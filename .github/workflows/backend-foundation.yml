name: Backend foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend and test dependencies
        run: python -m pip install -e './backend[test]'
      - name: Validate migrations, security and tenant boundaries
        run: python -m pytest -c backend/pyproject.toml backend/foundation_tests -q
      - name: Check installed migration CLI
        run: arc-foundation --help
