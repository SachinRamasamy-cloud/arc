# STAGING REFERENCE ONLY. Terminate TLS upstream; do not expose this plaintext listener publicly.
# Run console/data factories independently; the operator API is intentionally absent.
static_resources:
  listeners:
    - name: public_api
      address: {socket_address: {address: 0.0.0.0, port_value: 8080}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: api
                codec_type: AUTO
                stream_idle_timeout: 60s
                request_timeout: 30s
                route_config:
                  name: arc
                  virtual_hosts:
                    - name: api
                      domains: ["api.example.invalid"]
                      routes:
                        - match: {safe_regex: {regex: "/v1/jobs/[^/]+/events"}}
                          route: {cluster: streams, timeout: 0s, idle_timeout: 30s}
                        # Public developer reference; staff routes are never exposed.
                        - match: {path: /docs}
                          route: {cluster: data, timeout: 15s}
                        - match: {path: /docs/}
                          route: {cluster: data, timeout: 15s}
                        - match: {prefix: /v1/}
                          route: {cluster: data, timeout: 30s}
                        - match: {prefix: /api/public/}
                          route: {cluster: data, timeout: 30s}
                        - match: {prefix: /api/payments/stripe/webhook}
                          route: {cluster: data, timeout: 30s}
                        - match: {prefix: /}
                          direct_response: {status: 404, body: {inline_string: '{"code":"NOT_FOUND","detail":"This endpoint is not available."}'}}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
  clusters:
    - name: data
      type: STRICT_DNS
      connect_timeout: 3s
      lb_policy: LEAST_REQUEST
      load_assignment:
        cluster_name: data
        endpoints:
          - lb_endpoints:
              - endpoint: {address: {socket_address: {address: data-api, port_value: 8000}}}
      health_checks:
        - timeout: 2s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 2
          http_health_check: {path: /health/ready}
    - name: streams
      type: STRICT_DNS
      connect_timeout: 3s
      lb_policy: LEAST_REQUEST
      load_assignment:
        cluster_name: streams
        endpoints:
          - lb_endpoints:
              - endpoint: {address: {socket_address: {address: event-api, port_value: 8000}}}
admin:
  address: {socket_address: {address: 127.0.0.1, port_value: 9901}}
